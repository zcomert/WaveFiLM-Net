# Head configurations (WaveFiLM-Net, its variants, comparators, and controls) and the registered
# experiments by stage. Specification fields are described in wavefilm_net/model.py. `seeds` lists the
# seeds that were run, including extensions to seeds 4-5 (manuscript Section 2.5). `reference` is the
# configuration of the paired comparison. Generated by the study export script.
configurations:
  lp:
    spec: {}
    description: 'Linear probe: GAP and a linear classifier'
  threshold_mask:
    spec: {prior: threshold_mask}
    description: Fixed-threshold Hessian mask on the LP features
  threshold_mask_pooling_bands:
    spec: {prior: threshold_mask, subband: pooling_bands}
    description: Fixed-threshold Hessian mask with 2 x 2 average-pooling band fusion
  gf_head:
    spec: {prior: threshold_mask, subband: pooling_bands, fusion: softmax_gate}
    description: Parameter-matched gated-fusion (GF) head
  binary_prior:
    spec: {prior: binary}
    description: HSP map as a binary mask (1 above 0.1, else 0.5)
  soft_prior:
    spec: {prior: soft}
    description: Soft mask F (0.5 + 0.5 m)
  hsp:
    spec: {prior: residual}
    description: HSP residual injection, Eq. (2)
  prior_film:
    spec: {prior: film}
    description: FiLM from the HSP map through a two-layer 1 x 1 network
  blob_prior:
    spec: {prior: blob_residual}
    description: Blob prior with residual scaling
  ridge_blob_prior:
    spec: {prior: ridge_blob_residual}
    description: Ridge plus blob priors with residual scaling
  hsp_pooling_bands:
    spec: {prior: residual, subband: pooling_bands}
    description: HSP + fixed average-pooling band fusion
  hsp_fixed_haar:
    spec: {prior: residual, subband: fixed_haar}
    description: HSP + fixed Haar fusion
  hsp_dhsr:
    spec: {prior: residual, subband: dhsr}
    description: HSP + DHSR
  hsp_learned_pooling:
    spec: {prior: residual, subband: learned_pooling}
    description: HSP + average-pooling band fusion with a learnable coarse band
  hsp_no_subband:
    spec: {prior: residual, subband: no_subband}
    description: HSP + no-subband control (same layers as DHSR)
  hsp_dhsr_softmax_gate:
    spec: {prior: residual, subband: dhsr, fusion: softmax_gate}
    description: HSP + DHSR + channel-softmax gated fusion
  hsp_dhsr_sigmoid_gate:
    spec: {prior: residual, subband: dhsr, fusion: sigmoid_gate}
    description: HSP + DHSR + channel-sigmoid gated fusion
  hsp_dhsr_scalar_gate:
    spec: {prior: residual, subband: dhsr, fusion: scalar_gate}
    description: HSP + DHSR + scalar stream gates
  hsp_dhsr_two_way:
    spec: {prior: residual, subband: dhsr, fusion: two_way}
    description: HSP + DHSR + per-location two-way fusion
  wavefilm_net:
    spec: {prior: residual, subband: dhsr, fusion: sff}
    description: 'WaveFiLM-Net: HSP + DHSR + SFF'
  wavefilm_net_context_pool:
    spec: {prior: residual, subband: dhsr, fusion: sff, pooling: context}
    description: WaveFiLM-Net with context-weighted pooling
  wavefilm_net_prior_stream:
    spec: {prior: residual, subband: dhsr, fusion: sff, prior_stream: true}
    description: WaveFiLM-Net with a separate prior stream head
  wavefilm_net_without_hsp:
    spec: {subband: dhsr, fusion: sff}
    description: Ablation without HSP (S1 = F)
  wavefilm_net_without_dhsr:
    spec: {prior: residual, fusion: sff}
    description: Ablation without DHSR (SFF from S1)
  wavefilm_net_shuffled_prior:
    spec: {prior: residual, subband: dhsr, fusion: sff, shuffle_prior: true}
    description: Shuffled-prior control
  wavefilm_net_blob_prior:
    spec: {prior: blob_residual, subband: dhsr, fusion: sff}
    description: Blob prior instead of the HSP map
  wavefilm_net_no_subband_control:
    spec: {prior: residual, subband: no_subband, fusion: sff}
    description: No-subband control replaces DHSR
  wavefilm_net_replicate_padding:
    spec: {prior: residual, subband: dhsr_replicate, fusion: sff}
    description: Replicated border before the Haar transform
  bilinear_512:
    spec: {bilinear_rank: 512}
    description: Low-rank bilinear head, rank 512
  bilinear_3328:
    spec: {bilinear_rank: 3328}
    description: Low-rank bilinear head, rank 3,328
  se_head:
    spec: {attention: se}
    description: SE block before GAP on frozen features
  cbam_head:
    spec: {attention: cbam}
    description: CBAM block before GAP on frozen features
  finetuned:
    spec: {finetune: true, lr_backbone: 0.0001}
    description: Fine-tuned backbone with GAP and a linear classifier
  finetuned_wavefilm_net:
    spec: {prior: residual, subband: dhsr, fusion: sff, finetune: true, lr_backbone: 0.0001}
    description: WaveFiLM-Net head on a fine-tuned backbone
